<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị & Đội Ngũ — Ngọc Châu Cinema</title>
  
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">

  <div class="login-card" style="max-width: 480px;">
    <div class="login-header">
      <img src="logo/logo.jpg" alt="Ngọc Châu Cinema Logo" class="login-logo">
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary-gold);">NGỌC CHÂU CINEMA</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem;">Hệ thống Cổng Đăng Nhập Phân Quyền Vận Hành</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="username">Email hoặc Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" placeholder="admin@demo.com, staff1@demo.com, ntt1@demo.com..." required value="admin">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required value="admin123">
      </div>

      <!-- Demo Accounts Matrix Box -->
      <div style="background-color: rgba(212,175,55,0.08); border: 1px solid var(--border-color-gold); padding: 1rem; border-radius: var(--radius-md); font-size: 0.85rem; color: var(--text-primary); margin-bottom: 1.5rem; text-align: left; line-height: 1.5;">
        <div style="font-weight: 700; color: var(--primary-gold); margin-bottom: 0.5rem; font-size: 0.9rem;">🔐 Danh Sách Tài Khoản Thử Nghiệm:</div>
        <div>👑 <strong>ADMIN:</strong> <code>admin@demo.com</code> hoặc <code>admin</code> (pass: <code>admin123</code>)</div>
        <div>🎬 <strong>NHÀ TÀI TRỢ:</strong> <code>ntt1@demo.com</code> (pass: <code>123456</code>)</div>
        <div>⏰ <strong>STAFF:</strong> <code>staff1@demo.com</code> (pass: <code>123456</code>)</div>
        <div>🎟️ <strong>USER:</strong> <code>user1@demo.com</code> (pass: <code>123456</code>)</div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 700;">🔑 ĐĂNG NHẬP VÀO HỆ THỐNG</button>
    </form>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
